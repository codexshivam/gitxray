name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Test Suite
        run: npm test
      - name: Verify CLI Entrypoints
        run: |
          node bin/gitxray.js inspect
          node bin/gitxray.js unbox
          node bin/gitxray.js badge gitxray/gitxray
